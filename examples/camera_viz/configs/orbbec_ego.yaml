source: local
verbose: false

display:
  mode: window
  window:
    # Set to sbs (or pass --stereo-debug sbs) to inspect ColorLeft|ColorRight
    # in the desktop window. XR always submits the two eyes independently.
    stereo_debug: off
  placements:
    orbbec_ego:
      lock_mode: world
      position: [0.0, 0.0, -1.5]
      size: [1.0, 0.8125]

cameras:
  - name: orbbec_ego
    enabled: true
    type: orbbec_ego
    stereo: true
    device_uid: ""
    width: 1600
    height: 1300
    fps: 30
    format: h264
    gpu_id: 0
