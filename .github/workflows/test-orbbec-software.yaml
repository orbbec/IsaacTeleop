name: Test Orbbec Software

on:
  push:
    branches: [main, 'release/*.*.x']
    paths:
    - '.github/workflows/test-orbbec-software.yaml'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/plugins/orbbec/**'
    - 'src/core/schema/**'
    - 'src/core/schema_tests/**'
    - 'src/core/mcap/**'
    - 'src/core/deviceio_base/**'
    - 'src/core/deviceio_session/**'
    - 'src/core/deviceio_trackers/**'
    - 'src/core/replay_deviceio_session_tests/**'
  pull_request:
    paths:
    - '.github/workflows/test-orbbec-software.yaml'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/plugins/orbbec/**'
    - 'src/core/schema/**'
    - 'src/core/schema_tests/**'
    - 'src/core/mcap/**'
    - 'src/core/deviceio_base/**'
    - 'src/core/deviceio_session/**'
    - 'src/core/deviceio_trackers/**'
    - 'src/core/replay_deviceio_session_tests/**'
  workflow_dispatch:

concurrency:
  group: orbbec-software-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-orbbec-software:
    # This runner carries the licensed SDK but intentionally has no camera.
    # Do not run untrusted fork code on the self-hosted runner.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, orbbec-sdk]
    timeout-minutes: 45
    env:
      ORBBEC_SDK_ROOT: ${{ vars.ORBBEC_SDK_ROOT }}
      UV_CACHE_DIR: /tmp/isaacteleop-uv-cache

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install pinned uv
      uses: ./.github/actions/setup-uv

    - name: Check runner SDK
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${ORBBEC_SDK_ROOT}" ]]; then
          echo "Set the protected ORBBEC_SDK_ROOT Actions variable for the orbbec-sdk runner."
          exit 1
        fi
        for required in \
          "${ORBBEC_SDK_ROOT}/include/libobsensor/ObSensor.hpp" \
          "${ORBBEC_SDK_ROOT}/lib/OrbbecSDKConfig.cmake" \
          "${ORBBEC_SDK_ROOT}/lib/libOrbbecSDK.so.2"; do
          [[ -f "${required}" ]] || { echo "Missing Orbbec SDK file: ${required}"; exit 1; }
        done

    - name: Configure and build Orbbec software tests
      shell: bash
      run: |
        set -euo pipefail
        cmake -S . -B build-orbbec-software \
          -DISAAC_TELEOP_PYTHON_VERSION=3.11 \
          -DBUILD_VIZ=OFF \
          -DBUILD_PLUGIN_ORBBEC_CAMERA=ON \
          -DORBBEC_SDK_ROOT="${ORBBEC_SDK_ROOT}"
        cmake --build build-orbbec-software --parallel 4

    - name: Run hardware-free Orbbec tests
      shell: bash
      run: |
        set -euo pipefail
        env -u PYTHONPATH -u AMENT_PREFIX_PATH -u COLCON_PREFIX_PATH \
          ctest --test-dir build-orbbec-software --output-on-failure --parallel 4 \
          --no-tests=error -R '[Oo]rbbec'

    - name: Upload CTest failure logs
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: orbbec-software-ctest-logs
        path: build-orbbec-software/Testing/Temporary
        if-no-files-found: warn
        retention-days: 14
